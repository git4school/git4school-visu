<div class="accounts-container">
  <!-- Accounts List -->
  <ng-container *ngIf="(accountsService.accounts$ | async) as accounts">
    <div *ngIf="accounts.length > 0; else emptyState" class="accounts-card-list">
      <div
        *ngFor="let acc of accounts"
        class="account-card"
        [class.confirming]="confirmDisconnectId === acc.id"
      >
        <div class="card-main-content">
          <!-- Avatar with provider badge overlay -->
          <div class="avatar-wrapper">
            <img
              *ngIf="acc.avatarUrl"
              [src]="acc.avatarUrl"
              [alt]="acc.username"
              class="account-avatar"
              (error)="acc.avatarUrl = null"
            />
            <div *ngIf="!acc.avatarUrl" class="account-avatar-fallback">
              {{ acc.username.charAt(0).toUpperCase() }}
            </div>
            <span class="provider-badge-icon" [ngClass]="acc.provider">
              <svg *ngIf="acc.provider === 'github'" viewBox="0 0 496 512" fill="currentColor">
                <path d="M165.9 397.4c0 2-2.3 3.6-5.2 3.6-3.3.3-5.6-1.3-5.6-3.6 0-2 2.3-3.6 5.2-3.6 3-.3 5.6 1.3 5.6 3.6zm-31.1-4.5c-.7 2 1.3 4.3 4.3 4.9 2.6 1 5.6 0 6.2-2s-1.3-4.3-4.3-5.2c-2.6-.7-5.5.3-6.2 2.3zm44.2-1.7c-2.9.7-4.9 2.6-4.6 4.9.3 2 2.9 3.3 5.9 2.6 2.9-.7 4.9-2.6 4.6-4.6-.3-1.9-3-3.2-5.9-2.9zM244.8 8C106.1 8 0 113.3 0 252c0 110.9 69.8 205.8 169.5 239.2 12.8 2.3 17.3-5.6 17.3-12.1 0-6.2-.3-40.4-.3-61.4 0 0-70 15-84.7-29.8 0 0-11.4-29.1-27.8-36.6 0 0-22.9-15.7 1.6-15.4 0 0 24.9 2 38.6 25.8 21.9 38.6 58.6 27.5 72.9 20.9 2.3-16 8.8-27.1 16-33.7-55.9-6.2-112.3-14.3-112.3-110.5 0-27.5 7.6-41.3 23.6-58.9-2.6-6.5-11.1-33.3 2.6-67.9 20.9-6.5 69 27 69 27 20-5.6 41.5-8.5 62.8-8.5s42.8 2.9 62.8 8.5c0 0 48.1-33.6 69-27 13.7 34.7 5.2 61.4 2.6 67.9 16 17.7 25.8 31.5 25.8 58.9 0 96.5-58.9 104.2-114.8 110.5 9.2 7.9 17 22.9 17 46.4 0 33.7-.3 75.4-.3 83.6 0 6.5 4.6 14.4 17.3 12.1C428.2 457.8 496 362.9 496 252 496 113.3 383.5 8 244.8 8zM97.2 352.9c-1.3 1-1 3.3.7 5.2 1.6 1.6 3.9 2.3 5.2 1 1.3-1 1-3.3-.7-5.2-1.6-1.6-3.9-2.3-5.2-1zm-10.8-8.1c-.7 1.3.3 2.9 2.3 3.9 1.6 1 3.6.7 4.3-.7.7-1.3-.3-2.9-2.3-3.9-2-.6-3.6-.3-4.3.7zm32.4 35.6c-1.6 1.3-1 4.3 1.3 6.2 2.3 2.3 5.2 2.6 6.5 1 1.3-1.3.7-4.3-1.3-6.2-2.2-2.3-5.2-2.6-6.5-1zm-11.4-14.7c-1.6 1-1.6 3.6 0 5.9 1.6 2.3 4.3 3.3 5.6 2.3 1.6-1.3 1.6-3.9 0-6.2-1.4-2.3-4-3.3-5.6-2z"/>
              </svg>
              <svg *ngIf="acc.provider === 'gitlab'" viewBox="0 0 512 512" fill="currentColor">
                <path d="M105.2 24.9c-3.1-8.9-15.7-8.9-18.9 0L29.8 199.7h132c-.1 0-56.6-174.8-56.6-174.8zM.9 287.7c-2.6 8 .3 16.9 7.1 22l247.9 184-226.2-294zm160.8-88l94.3 294 94.3-294zm349.4 88l-28.8-88-226.3 294 247.9-184c6.9-5.1 9.7-14 7.2-22zM425.7 24.9c-3.1-8.9-15.7-8.9-18.9 0l-56.6 174.8h132z"/>
              </svg>
            </span>
          </div>

          <!-- Info -->
          <div class="account-meta">
            <div class="meta-header">
              <a
                class="username"
                [href]="getProfileUrl(acc)"
                target="_blank"
                rel="noopener noreferrer"
                [appTooltip]="acc.username"
                [onlyIfTruncated]="true"
                (click)="$event.stopPropagation()"
              >
                <span>{{ acc.username }}</span>
                <svg viewBox="0 0 24 24" width="11" height="11" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="external-icon">
                  <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path>
                  <polyline points="15 3 21 3 21 9"></polyline>
                  <line x1="10" y1="14" x2="21" y2="3"></line>
                </svg>
              </a>
            </div>
            <div class="instance-badge-wrapper">
              <span class="instance-host-pill">
                {{ acc.instanceHost }}
              </span>
            </div>
          </div>

          <!-- Actions -->
          <div class="account-actions" [class.confirming]="confirmDisconnectId === acc.id">
            <!-- Morphing Primary Button (Disconnect -> Confirm) -->
            <button
              type="button"
              class="btn-action-primary"
              [class.is-confirming]="confirmDisconnectId === acc.id"
              (click)="onDisconnectClick(acc, $event)"
              [appTooltip]="(confirmDisconnectId === acc.id ? 'ACCOUNTS.CONFIRM_DISCONNECT_BTN' : 'ACCOUNTS.DISCONNECT_TOOLTIP') | translate"
              [attr.aria-label]="(confirmDisconnectId === acc.id ? 'ACCOUNTS.CONFIRM_DISCONNECT_BTN' : 'ACCOUNTS.DISCONNECT_TOOLTIP') | translate"
            >
              <span class="icon-layer icon-disconnect">
                <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                  <polyline points="16 17 21 12 16 7"></polyline>
                  <line x1="21" y1="12" x2="9" y2="12"></line>
                </svg>
              </span>
              <span class="icon-layer icon-confirm">
                <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                  <polyline points="20 6 9 17 4 12"></polyline>
                </svg>
              </span>
            </button>

            <!-- Revealing Secondary Button (Cancel) -->
            <button
              type="button"
              class="btn-action-cancel"
              [class.is-visible]="confirmDisconnectId === acc.id"
              (click)="cancelDisconnect($event)"
              [appTooltip]="'CANCEL' | translate"
              [attr.aria-label]="'CANCEL' | translate"
              [attr.tabindex]="confirmDisconnectId === acc.id ? 0 : -1"
              [attr.aria-hidden]="confirmDisconnectId !== acc.id"
            >
              <svg viewBox="0 0 24 24" width="11" height="11" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="18" y1="6" x2="6" y2="18"></line>
                <line x1="6" y1="6" x2="18" y2="18"></line>
              </svg>
            </button>
          </div>
        </div>

        <!-- Expiry footer info on card -->
        <div class="card-footer-info" *ngIf="acc.tokenExpiresInDays">
          <span class="footer-expiry">
            {{ acc.tokenExpiresInDays }} {{ 'ACCOUNTS.DAYS' | translate }}
          </span>
        </div>
      </div>

      <!-- Add Account Button -->
      <button type="button" class="btn-add-account-dashed" (click)="onAddAccount()">
        <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="mr-2">
          <line x1="12" y1="5" x2="12" y2="19"></line>
          <line x1="5" y1="12" x2="19" y2="12"></line>
        </svg>
        <span>{{ 'ACCOUNTS.ADD_ACCOUNT' | translate }}</span>
      </button>
    </div>

    <!-- Empty State -->
    <ng-template #emptyState>
      <div class="accounts-empty-card">
        <div class="empty-icon-wrapper">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M15 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
            <circle cx="8" cy="7" r="4"></circle>
            <rect x="16" y="9" width="6" height="7" rx="1"></rect>
            <path d="M17.5 9V7a1.5 1.5 0 0 1 3 0v2"></path>
          </svg>
        </div>
        <h6 class="empty-title">{{ 'ACCOUNTS.EMPTY_TITLE' | translate }}</h6>
        <p class="empty-desc">{{ 'ACCOUNTS.EMPTY_DESC' | translate }}</p>
        <button type="button" class="btn btn-primary btn-sm btn-connect-now" (click)="onAddAccount()">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
            <circle cx="8.5" cy="7" r="4"></circle>
            <line x1="20" y1="8" x2="20" y2="14"></line>
            <line x1="23" y1="11" x2="17" y2="11"></line>
          </svg>
          <span>{{ 'ACCOUNTS.CONNECT_BTN' | translate }}</span>
        </button>
      </div>
    </ng-template>
  </ng-container>
</div>
