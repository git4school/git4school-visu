<div class="app-layout-wrapper d-flex" [class.is-resizing]="isResizing" [style.--sidebar-width]="sidebarWidth + 'px'" style="height: 100vh; overflow: hidden;">
    <!-- Global Sidebar -->
    <div class="sidebar-spacer" [class.pinned]="isSidebarPinned"></div>
    <div class="sidebar-actual-panel shadow-lg" [class.pinned]="isSidebarPinned" [class.hovered]="isSidebarHovered" (mouseenter)="onSidebarEnter()" (mouseleave)="onSidebarLeave()">
        <app-sidebar-settings [isOpen]="isSidebarPinned || isSidebarHovered" (onClose)="closeSidebar()" class="d-flex flex-column flex-grow-1"></app-sidebar-settings>
        <div class="sidebar-resizer" (mousedown)="onResizeStart($event)"></div>
    </div>

    <!-- Main Content Area -->
    <div class="main-content flex-grow-1 d-flex flex-column" style="overflow: hidden; min-width: 0; min-height: 0;">
        <nav class="navbar sticky-top">
            <!-- LEFT SIDE: Brand & Navigation -->
            <div class="navbar-left d-flex align-items-center flex-nowrap">
                <button class="btn-icon-subtle mr-2" (click)="toggleSidebarPin()" (mouseenter)="onSidebarEnter()" (mouseleave)="onSidebarLeave()">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="3" y="4" width="18" height="16" rx="4" ry="4"></rect>
                            <line x1="9" y1="4" x2="9" y2="20"></line>
                            <path d="M16.5 9.5 L13.5 12 L16.5 14.5 Z" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linejoin="round"
                                  [style.transform]="isSidebarPinned ? 'rotate(0deg)' : 'rotate(180deg)'"
                                  style="transform-origin: 15px 12px; transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);">
                            </path>
                        </svg>
                </button>
                <div class="d-flex align-items-center text-nowrap mr-4">
                    <ng-container *ngIf="!isHome; else brandLogo">
                        <button class="btn btn-back mr-3 d-flex align-items-center" routerLink="home">
                            <i class="fas fa-arrow-left"></i>
                            <span class="back-text">{{ 'NAVBAR.ASSIGNMENTS' | translate }}</span>
                        </button>
                        <div *ngIf="dataService.dataLoaded()" class="assignment-chip d-flex align-items-center">
                            <span [appTooltip]="dataService.title" placement="bottom">{{ truncatedTitle }}</span>
                            <button class="btn-action-icon ml-2" [appTooltip]="{ text: ('HOME.EDIT-ASSIGNMENT-TOOLTIP' | translate), shortcut: ['C'] }" placement="bottom" (click)="openCurrentAssignmentConfig()">
                                <i class="fas fa-cog" style="pointer-events: none;"></i>
                            </button>
                        </div>
                    </ng-container>
                    <ng-template #brandLogo>
                        <span id="document-title" class="navbar-brand mb-0 mr-0">Git4School</span>
                    </ng-template>
                </div>
                
                <ul class="navbar-nav flex-row align-items-center" *ngIf="!isHome">
                    <!-- 1. Overview -->
                    <li class="nav-item" routerLinkActive="active" *ngIf="dataService.dataLoaded()">
                        <a class="nav-link" routerLink="overview"
                           [appTooltip]="{ text: ('NAVBAR.OVERVIEW-TOOLTIP' | translate), shortcut: ['1'] }"
                           placement="bottom">
                            <i class="fas fa-layer-group mr-2"></i>{{ 'NAVBAR.OVERVIEW' | translate }}
                        </a>
                    </li>

                    <!-- 2. Students Commits -->
                    <li class="nav-item" routerLinkActive="active" *ngIf="dataService.dataLoaded()">
                         <a class="nav-link" routerLink="students-commits"
                            [appTooltip]="{ text: ('NAVBAR.STUDENTS-COMMITS-TOOLTIP' | translate), shortcut: ['2'] }"
                            placement="bottom">
                            <i class="fas fa-code-branch mr-2"></i>{{ 'NAVBAR.STUDENTS-COMMITS' | translate }}
                        </a>
                    </li>

                    <!-- 3. Questions Completion -->
                    <li class="nav-item" routerLinkActive="active" *ngIf="dataService.dataLoaded()">
                        <a class="nav-link" routerLink="questions-completion"
                           [appTooltip]="{ text: ('NAVBAR.QUESTIONS-COMPLETION-TOOLTIP' | translate), shortcut: ['3'] }"
                           placement="bottom">
                            <i class="fas fa-tasks mr-2"></i>{{ 'NAVBAR.QUESTIONS-COMPLETION' | translate }}
                        </a>
                    </li>
                </ul>
            </div>

            <!-- RIGHT SIDE: Actions & Settings -->
            <div class="navbar-right d-flex align-items-center flex-nowrap">
            </div>
        </nav>

        <div class="container-fluid flex-grow-1 d-flex flex-column" [class.px-0]="isHome" style="overflow: hidden; min-height: 0;">
            <div class="row flex-grow-1" [class.mx-0]="isHome" style="overflow: hidden; min-height: 0;">
                <div class="col-12 d-flex flex-column" [class.px-0]="isHome" [style.padding-bottom]="isHome ? '0' : '1rem'" style="overflow-y: auto; overflow-x: hidden; min-height: 0; max-height: 100%;">
                    <router-outlet></router-outlet>
                </div>
            </div>
        </div>
    </div>

</div>
