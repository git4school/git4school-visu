<div class="modal-header border-bottom-0 pb-3 pt-4 px-4 align-items-center flex-nowrap w-100">
    <h4 class="modal-title font-weight-bold m-0" style="font-size: 1.25rem; color: var(--color-text-primary);">
        {{ (this.addMode ? 'EDIT-SESSION.CREATE-TITLE' : 'EDIT-SESSION.EDIT-TITLE') | translate }}
    </h4>
    <div class="d-flex align-items-center ml-auto" style="gap: 0.5rem;">
        <button type="button" class="btn btn-outline-ghost" style="font-weight: 500; border-radius: 8px; padding: 0.4rem 1rem;" (click)="activeModalService.dismiss('Cross click')">
            {{ 'CANCEL' | translate }}
        </button>
        <button *ngIf="!addMode" type="button" class="btn btn-danger shadow-sm" style="font-weight: 500; border-radius: 8px; padding: 0.4rem 1rem; text-transform: none;" (click)="deleteSession()">
            <i class="fas fa-trash-alt mr-2"></i> {{ 'EDIT-SESSION.DELETE-BUTTON' | translate }}
        </button>
        <button type="button" class="btn btn-primary shadow-sm" style="font-weight: 500; border-radius: 8px; padding: 0.4rem 1rem; text-transform: none;" (click)="submitSession()" [disabled]="!sessionForm.valid">
            <i class="fas fa-save mr-2"></i> {{ 'OVERVIEW-GRAPH.MODAL.CONFIRM' | translate }}
        </button>
    </div>
</div>
<div class="modal-body mx-2">
    <form [formGroup]="sessionForm" (keydown.enter)="$event.preventDefault()" class="needs-validation">
        <div class="form-group required">
            <label class="required-label">{{ 'EDIT-SESSION.DATE-LABEL' | translate }}</label>
            <app-date-range-picker
                [singleMode]="true"
                [singleLabel]="' '"
                [date]="sessionForm.get('date')?.value"
                (dateChange)="sessionForm.get('date')?.setValue($event); sessionForm.get('date')?.markAsDirty()">
            </app-date-range-picker>
        </div>
        <div class="form-row">
            <div class="form-group col required">
                <label class="required-label">
                    {{ 'EDIT-SESSION.START-TIME-LABEL' | translate }} / {{ 'EDIT-SESSION.END-TIME-LABEL' | translate }}
                </label>
                <div class="d-flex justify-content-center w-100 mt-2">
                    <app-time-picker 
                        mode="period" 
                        [startTime]="sessionForm.get('startTime')?.value"
                        [endTime]="sessionForm.get('endTime')?.value"
                        [defaultDuration]="defaultSessionDuration ? defaultSessionDuration.hour * 60 + defaultSessionDuration.minute : 120"
                        (periodChange)="onPeriodChange($event)">
                    </app-time-picker>
                </div>
                <div *ngIf="sessionForm.errors" class="small form-text text-danger mt-2">
                    <div *ngIf="sessionForm.errors['endTimeBeforeStartTime']">
                        {{ 'EDIT-SESSION.MESSAGE-ENDTIME-BEFORE-STARTTIME' | translate }}
                    </div>
                </div>
            </div>
        </div>

        <div class="form-group">
            <!-- tpGroup -->
            <label for="tpGroup">
                {{ 'EDIT-SESSION.TP-GROUP-LABEL' | translate }}
            </label>
            <input id="tpGroup" type="text" class="form-control" formControlName="tpGroup"
                   placeholder="d.ff"
                   [ngbTypeahead]="searchGroup"
                   container="body"
                   (focus)="focus$.next($any($event).target.value)"
                   (click)="click$.next($any($event).target.value)"
                   #instance="ngbTypeahead" />
        </div>

        <div class="form-group">
            <label for="notes">{{ 'EDIT-SESSION.NOTES' | translate }}</label>
            <textarea class="form-control" id="notes" rows="5" formControlName="notes"></textarea>
        </div>

        <div class="my-3">
            <span class="text-danger">*</span> {{ "REQUIRED-FIELDS-TEXT" | translate }}
        </div>

    </form>
</div>
