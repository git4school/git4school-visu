<div ngbDropdown display="static" class="contextMenu" [style.left]="left" [style.top]="top">
  <div ngbDropdownMenu class="modern-dropdown-menu">
    <div>
      @if (editMilestoneMode) {
        <button ngbDropdownItem (click)="editMilestone()"><i
        class="fas fa-pencil-alt fa-sm mr-2"></i>{{
      'EDIT-MILESTONE-CONTEXT-MENU' | translate }}</button>
    }
    @if (!editMilestoneMode) {
      <button ngbDropdownItem (click)="addMilestone()"><i
      class="fas fa-plus fa-sm mr-2"></i>{{
    'ADD-MILESTONE-CONTEXT-MENU' | translate }}</button>
  }
</div>
<div>
  @if (editSessionMode) {
    <button ngbDropdownItem (click)="editSession()"><i
    class="fas fa-pencil-alt fa-sm mr-2"></i>{{
  'EDIT-SESSION-CONTEXT-MENU' | translate }}</button>
}
<button ngbDropdownItem (click)="addSession()"><i
class="fas fa-plus fa-sm mr-2"></i>{{
'ADD-SESSION-CONTEXT-MENU' |
translate }}</button>
</div>
@if (editMilestoneMode || editSessionMode) {
  <div class="dropdown-divider"></div>
}
@if (editMilestoneMode) {
  <button ngbDropdownItem class="dropdown-item-danger" (click)="removeMilestone(milestone)"><i
  class="far fa-trash-alt fa-sm mr-2"></i>{{
'DELETE-MILESTONE-CONTEXT-MENU' | translate }}</button>
}
@if (editSessionMode) {
  <button ngbDropdownItem class="dropdown-item-danger" (click)="removeSession(session)"><i
  class="far fa-trash-alt fa-sm mr-2"></i>{{
'DELETE-SESSION-CONTEXT-MENU' | translate }}</button>
}
</div>
</div>
