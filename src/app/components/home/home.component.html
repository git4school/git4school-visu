<div class="page-container d-flex flex-column" style="min-height: 100vh;">
  <div class="content-wrap d-flex flex-column flex-grow-1 p-4">
    <!-- Header -->
    <div class="d-flex justify-content-between align-items-center mb-4">
      <h2 class="font-weight-bold" style="color: var(--color-primary); margin: 0;">
        {{ 'HOME.ASSIGNMENT-LIST.TITLE' | translate }}
      </h2>
    </div>

    <!-- Login Prompt if unauthenticated -->
    <div *ngIf="!authService.isSignedIn()" class="login-prompt mb-4 p-4 rounded d-flex justify-content-between align-items-center" style="background: var(--color-surface); border: 1px solid var(--color-border);">
      <div>
        <h5 class="mb-1 text-primary font-weight-bold"><i class="fas fa-info-circle mr-2"></i>{{ 'HOME.CONNECT-PROMPT-TITLE' | translate }}</h5>
        <p class="mb-0" style="color: var(--color-text-secondary);">{{ 'HOME.CONNECT-PROMPT-DESC' | translate }}</p>
      </div>
      <button class="btn btn-primary d-flex align-items-center" [disabled]="authService.loading" (click)="onSignInGithub()" style="border-radius: 20px; padding: 0.5rem 1.5rem;">
        <span *ngIf="authService.loading" class="spinner-border spinner-border-sm mr-2" role="status" aria-hidden="true"></span>
        <i *ngIf="!authService.loading" class="fab fa-github mr-2"></i>
        {{ 'NAVBAR.SIGN-IN' | translate }}
      </button>
    </div>

    <!-- Assignment Chooser always visible -->
    <div class="flex-grow-1">
      <assignment-chooser></assignment-chooser>
    </div>
  </div>

  <footer class="home-footer p-3 mt-auto d-flex justify-content-between align-items-center text-muted" style="background: var(--color-surface); border-top: 1px solid var(--color-border); font-size: 0.9rem;">
    <div>Version : {{ version }}</div>
    <div>Copyright © 2019 Université Toulouse 3 Paul Sabatier.</div>
    <div>
      <a href="https://github.com/git4school/git4school-visu" target="_blank" [ngbTooltip]="'GO-TO-GITHUB-TOOLTIP' | translate" style="color: var(--color-text-secondary);">
        <i class="fab fa-github fa-lg"></i>
      </a>
    </div>
  </footer>
</div>
