<div class="metadata-form-container mt-2">
  <form onkeydown="return event.key != 'Enter';" [formGroup]="metadataForm" novalidate>
    
    <!-- Row 1: Title, Course, Program -->
    <div class="form-row mt-2">
      <!-- Title -->
      <div class="col-md-6">
        <app-text-input
          id="title"
          formControlName="title"
          [label]="'METADATA.TITLE' | translate"
          [helperText]="'METADATA.TITLE' | translate"
          [required]="true"
          [invalid]="metadataForm.controls.title.invalid && metadataForm.controls.title.touched"
          [valid]="!metadataForm.controls.title.invalid && metadataForm.controls.title.touched">
        </app-text-input>
      </div>

      <!-- Course -->
      <div class="col-md-3">
        <app-text-input
          id="course"
          formControlName="course"
          [label]="'METADATA.COURSE' | translate"
          [helperText]="'METADATA.COURSE' | translate">
        </app-text-input>
      </div>

      <!-- Program -->
      <div class="col-md-3">
        <app-text-input
          id="program"
          formControlName="program"
          [label]="'METADATA.PROGRAM' | translate"
          [helperText]="'METADATA.PROGRAM' | translate">
        </app-text-input>
      </div>
    </div>

    <!-- Row 2: Year, Dates, Duration -->
    <div class="form-row mt-2">
      <!-- Year -->
      <div class="col-md-2">
        <app-text-input
          id="year"
          formControlName="year"
          [label]="'METADATA.YEAR' | translate"
          [helperText]="'METADATA.YEAR' | translate">
        </app-text-input>
      </div>

      <!-- Start Date -->
      <div class="col-md-3">
        <div class="floating-group">
          <input class="floating-input with-icon-right" type="search" placeholder=" " ngbDatepicker
            #startDate="ngbDatepicker" formControlName="startDate" [showWeekNumbers]="true" id="startDate">
          <label class="floating-label" for="startDate">{{ 'METADATA.START-DATE' | translate }}</label>
          
          <button class="floating-icon-right" (click)="startDate.toggle()" type="button" tabindex="-1">
            <i class="far fa-calendar-alt"></i>
          </button>
        </div>
      </div>

      <!-- End Date -->
      <div class="col-md-3">
        <div class="floating-group">
          <input class="floating-input with-icon-right" type="search" placeholder=" " ngbDatepicker
            #endDate="ngbDatepicker" formControlName="endDate" [showWeekNumbers]="true" id="endDate">
          <label class="floating-label" for="endDate">{{ 'METADATA.END-DATE' | translate }}</label>
          
          <button class="floating-icon-right" (click)="endDate.toggle()" type="button" tabindex="-1">
            <i class="far fa-calendar-alt"></i>
          </button>
        </div>
      </div>

      <!-- Duration -->
      <div class="col-md-4">
        <div class="form-group required mb-2 d-flex align-items-center h-100" style="margin-top: -0.5rem;">
          <label class="required-label mr-3 mb-0" for="defaultSessionDuration" style="font-weight: 500; font-size: 0.85rem; color: var(--color-text-secondary); white-space: nowrap;">{{ 'DEFAULT-SESSION-DURATION' | translate}}</label>
          <ngb-timepicker id="defaultSessionDuration" formControlName="defaultSessionDuration" size="small"
            [spinners]="false">
          </ngb-timepicker>
        </div>
      </div>
    </div>

    <!-- Row 3: Questions -->
    <div class="form-row mt-1">
      <div class="col-md-12">
        <div class="form-group mb-0">
          <label for="questionsChooser" style="font-weight: 500; font-size: 0.85rem; color: var(--color-text-secondary); margin-bottom: 0.2rem;">{{ 'QUESTIONS' | translate }}</label>
          <questions-chooser #questionsChooser formControlName="questions"
            [editable]="true" [openOnFocus]="true" [noQuestionMessage]="true">
          </questions-chooser>
        </div>
      </div>
    </div>

  </form>
</div>
