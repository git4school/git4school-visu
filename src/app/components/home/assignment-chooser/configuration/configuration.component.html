<div class="inline-config-container">
    <div id="tour-autosave" class="d-flex align-items-center justify-content-between config-header">
        <div class="d-flex align-items-center" style="gap: 1.5rem;">
            <div class="filter-group" [attr.data-active]="activeTab">
                <div class="filter-indicator"></div>
                <button class="filter-btn" [class.active]="activeTab === 'metadata'" (click)="selectTab('metadata')">
                    <i class="fas fa-info-circle mr-2"></i> {{ 'CONFIGURATION.EDIT-METADATA' | translate }}
                </button>
                <button id="tour-repositories-tab" class="filter-btn" [class.active]="activeTab === 'repositories'"
                    (click)="selectTab('repositories')">
                    <app-repo-icon class="mr-2"></app-repo-icon> {{ 'CONFIGURATION.EDIT-REPOSITORIES' | translate }}
                </button>
            </div>
            <span class="autosave-indicator autosave-indicator--saving" *ngIf="saveState === 'saving'">
                <i class="fas fa-circle-notch fa-spin mr-1"></i> {{ 'AUTOSAVE.SAVING' | translate }}
            </span>
            <span class="autosave-indicator autosave-indicator--saved" *ngIf="saveState === 'saved'">
                <i class="fas fa-check mr-1"></i> {{ 'AUTOSAVE.SAVED' | translate }}
            </span>
            <span class="autosave-indicator autosave-indicator--warning" *ngIf="saveState === 'invalid'">
                <i class="fas fa-exclamation-circle mr-1"></i> {{ 'AUTOSAVE.UNSAVED-REQUIRED-TITLE' | translate }}
            </span>
        </div>

        <!-- Fermeture inline : le bouton d'édition de la carte se transforme en chevron, à la même position -->
        <button *ngIf="!activeModal && !modalRef" type="button" class="config-inline-close" (click)="closeEditor()"
            [appTooltip]="'HOME.CLOSE-EDIT-ASSIGNMENT-TOOLTIP' | translate"
            [attr.aria-label]="'HOME.CLOSE-EDIT-ASSIGNMENT-TOOLTIP' | translate" placement="left">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <polyline points="6 15 12 9 18 15"></polyline>
            </svg>
        </button>

        <button *ngIf="activeModal || modalRef" type="button" class="btn btn-outline-ghost" style="border-radius: 50%; width: 32px; height: 32px; padding: 0; display: flex; align-items: center; justify-content: center; background: var(--color-surface-hover);" (click)="closeEditor()">
            <i class="fas fa-times"></i>
        </button>
    </div>
    <div class="config-body">

        <div class="tab-content pt-0">
            <div [hidden]="activeTab !== 'metadata'">
                <metadata #metadataComp [metadata]="assignment.metadata" (modified)="onImmediateModification()"
                    (textModified)="onTextModification()" (textBlurred)="onTextBlur()">
                </metadata>
            </div>
            <div *ngIf="reposInitialized" [hidden]="activeTab !== 'repositories'">
                <edit-repositories #reposComp [datas]="assignment.repositories" [assignment]="assignment"
                    (modified)="onImmediateModification()">
                </edit-repositories>
            </div>
        </div>
        </div>
</div>
