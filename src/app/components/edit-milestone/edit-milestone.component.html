<div class="modal-header border-bottom-0 pb-3 pt-4 px-4 align-items-center flex-nowrap w-100">
    <h4 class="modal-title font-weight-bold m-0" style="font-size: 1.25rem; color: var(--color-text-primary);">
        {{ (this.addMode ? 'OVERVIEW-GRAPH.MODAL.TITLE-CREATE' : 'OVERVIEW-GRAPH.MODAL.TITLE-EDIT') |
        translate }}
    </h4>
    <div class="d-flex align-items-center ml-auto" style="gap: 0.5rem;">
        <button type="button" class="btn btn-outline-ghost" style="font-weight: 500; border-radius: 8px; padding: 0.4rem 1rem;" (click)="activeModalService.dismiss('Cross click')">
            {{ 'CANCEL' | translate }}
        </button>
        <button *ngIf="!addMode" type="button" class="btn btn-danger shadow-sm" style="font-weight: 500; border-radius: 8px; padding: 0.4rem 1rem; text-transform: none;" (click)="deleteMilestone()">
            <i class="fas fa-trash-alt mr-2"></i> {{ 'OVERVIEW-GRAPH.MODAL.DELETE' | translate }}
        </button>
        <button type="button" class="btn btn-primary shadow-sm" style="font-weight: 500; border-radius: 8px; padding: 0.4rem 1rem; text-transform: none;" (click)="submitMilestone()" [disabled]="!milestoneForm.valid">
            <i class="fas fa-save mr-2"></i> {{ 'OVERVIEW-GRAPH.MODAL.CONFIRM' | translate }}
        </button>
    </div>
</div>
<div class="modal-body mx-2">
    <form [formGroup]="milestoneForm" (keydown.enter)="$event.preventDefault()" class="needs-validation">
        <div class="form-row">
            <div class="form-group col-12 required">
                <label class="col-form-label required-label">{{ 'DATE' | translate }}</label>
                <app-date-range-picker
                    [singleMode]="true"
                    [singleLabel]="' '"
                    [date]="milestoneForm.get('date')?.value"
                    (dateChange)="milestoneForm.get('date')?.setValue($event); milestoneForm.get('date')?.markAsDirty()">
                </app-date-range-picker>
            </div>
            <div class="form-group col-12 required">
                <label for="time" class="col-form-label required-label">
                    {{ 'TIME' | translate }}
                </label>
                <div class="d-flex justify-content-center w-100 mt-2">
                    <app-time-picker 
                        mode="single" 
                        [time]="milestoneForm.get('time')?.value" 
                        (timeChange)="milestoneForm.get('time')?.setValue($event); milestoneForm.get('time')?.markAsDirty()">
                    </app-time-picker>
                </div>
            </div>
        </div>
        <div class="form-group">
            <label for="label" class="col-form-label">{{ 'OVERVIEW-GRAPH.MODAL.LABEL' | translate }}</label>
            <input type="text" class="form-control" id="label" formControlName="label">
        </div>
        <div class="form-group">
            <label for="tpGroup" class="col-form-label">{{ 'OVERVIEW-GRAPH.MODAL.TP-GROUP' | translate }}</label>
            <input id="tpGroup" type="text" class="form-control" formControlName="tpGroup"
                   placeholder="d.ff"
                   [ngbTypeahead]="searchGroup"
                   container="body"
                   (focus)="focus$.next($any($event).target.value)"
                   (click)="click$.next($any($event).target.value)"
                   #instance="ngbTypeahead" />
        </div>
        <div class="form-group">
            <label for="questionsChooser" class="col-form-label">{{ 'QUESTIONS' | translate }}</label>
            <questions-chooser #questionsChooser formControlName="questions" [questionSuggestions]="questions"
                [mode]="'choose'" [openOnFocus]="true">
            </questions-chooser>
        </div>
        <div class="form-group required">
            <label class="col-form-label required-label">{{ 'MILESTONE-TYPE' | translate
                }}</label><br>
            <app-type-picker 
                formControlName="type"
                [options]="milestoneTypes"
                [isInvalid]="milestoneForm.controls.type.invalid"
                errorMessage="{{ 'NO-MILESTONE-TYPE-FEEDBACK' | translate }}">
            </app-type-picker>

        </div>

        <div class="form-group">
            <label for="notes">{{ 'MILESTONE-NOTES' | translate }}</label>
            <textarea class="form-control" id="notes" rows="5" formControlName="notes"></textarea>
        </div>

        <div class="my-3">
            <span class="text-danger">*</span> {{ "REQUIRED-FIELDS-TEXT" | translate }}
        </div>

    </form>
</div>
