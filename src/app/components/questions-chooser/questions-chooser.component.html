<div class="pseudo-input-container form-control" [class.disabled]="disabled" (click)="inputField.focus()">
  <div #scrollContainer class="pills-scroll-container" 
       [style.max-width]="maxPillsWidth" 
       *ngIf="items.length > 0"
       (dragover)="onContainerDragOver($event)"
       (dragleave)="onContainerDragLeave($event)"
       (drop)="onContainerDrop($event)"
       style="position: relative;">
       
    <!-- Absolute Drop Indicator removed in favor of inline ghost preview -->

    <ng-container *ngFor="let item of items; let i = index; trackBy: trackByFn">
      
      <!-- Preview Left -->
      <ng-container *ngIf="dropTargetIndex === i && dropPosition === 'left'">
        <ng-container *ngTemplateOutlet="ghostPreview"></ng-container>
      </ng-container>

      <div class="pill" 
           #pillElements tabindex="-1"
           [draggable]="editingPillIndex === null"
           (dragstart)="onDragStart($event, i)"
           (dragend)="onDragEnd()"
           [class.commit-pill]="isCommitStyle(item, i)"
           [class.editing-pill]="editingPillIndex === i"
           [class.selected-pill]="selectedPillIndex === i"
           [class.merged-right]="isMergedRight(i)"
           [class.merged-left]="isMergedLeft(i)"
           [class.has-connector]="mode === 'search' && i < items.length - 1"
           [class.dragging]="draggedGroupStart !== null && i >= draggedGroupStart && i <= draggedGroupEnd"
           [class.exclusion-pill]="(editingPillIndex === i) ? editingIsExclusion : item.isExclusion"
           (click)="selectPill(i, $event)">
           
        <span *ngIf="editingPillIndex !== i">{{ item.value }}</span>
        <input *ngIf="editingPillIndex === i"
               #editInputs
               name="editInput_{{i}}"
               type="text"
               class="edit-input"
               [ngModel]="editingCurrentText"
               (ngModelChange)="onEditQuestionChange($event)"
               [ngModelOptions]="{standalone: true}"
               [ngbTypeahead]="searchQuestionsEdit"
               container="body"
               [resultTemplate]="rt"
               (selectItem)="onEditSelectItem($event)"
               (blur)="onEditBlur()"
               (focus)="editFocus$.next(editingCurrentText)"
               (click)="editFocus$.next(editingCurrentText)"
               (keydown)="onEditInputKeyDown($event)"
               size="{{ editingCurrentText.length || 1 }}" />
               
        <span class="close-icon" *ngIf="!disabled && !isMergedRight(i)" (click)="onCloseClick(i, $event)">
          <svg viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none">
              <line x1="16" y1="8" x2="8" y2="16"></line>
              <line x1="8" y1="8" x2="16" y2="16"></line>
          </svg>
        </span>
      </div>

      <!-- Connector -->
      <div *ngIf="mode === 'search' && i < items.length - 1"
           #connectorElements
           class="pill-connector"
           [class.merged]="item.operatorAfter === 'AND'"
           (click)="toggleOperator(i, $event)">
           
        <div class="connector-icon link-icon" *ngIf="item.operatorAfter !== 'AND'">
          <span>{{ 'QUESTIONS-CHOOSER-AND' | translate }}</span>
        </div>
        <div class="connector-icon unlink-icon" *ngIf="item.operatorAfter === 'AND'">
          <span>{{ 'QUESTIONS-CHOOSER-OR' | translate }}</span>
        </div>
      </div>

      <!-- Preview Right (only on the last element to cover dropping at the end) -->
      <ng-container *ngIf="i === items.length - 1 && dropTargetIndex === i && dropPosition === 'right'">
        <ng-container *ngTemplateOutlet="ghostPreview"></ng-container>
      </ng-container>

    </ng-container>
    
    <!-- Template for the Ghost Preview -->
    <ng-template #ghostPreview>
      <div *ngFor="let dItem of getDraggedItems(); let di = index" 
           class="pill ghost-preview"
           [class.commit-pill]="isCommitStyle(dItem, -1)"
           [class.merged-right]="di < getDraggedItems().length - 1"
           [class.merged-left]="di > 0">
        <span>{{ dItem.value }}</span>
        <span class="close-icon" *ngIf="!disabled && di === getDraggedItems().length - 1">
          <svg viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none">
              <line x1="16" y1="8" x2="8" y2="16"></line>
              <line x1="8" y1="8" x2="16" y2="16"></line>
          </svg>
        </span>
      </div>
    </ng-template>
  </div>
  
  <div class="main-input-wrapper position-relative d-flex align-items-center"
       [class.flex-grow-1]="!isMainPillActive"
       [class.pill]="isMainPillActive && mode !== 'choose'"
       [class.editing-pill]="isMainPillActive && mode !== 'choose'"
       [class.selected-pill]="isMainPillActive && mode !== 'choose'"
       [class.exclusion-pill]="isTypingExclusion"
       [class.commit-pill]="isMainPillActive && isCommitStyle({value: question}, -2)">
    <input #inputField type="text" [ngModel]="question" (ngModelChange)="onQuestionChange($event)" [ngbTypeahead]="searchQuestions"
        [class.transparent-input]="!isMainPillActive || mode === 'choose'"
        [class.edit-input]="isMainPillActive && mode !== 'choose'"
        [attr.size]="isMainPillActive ? (question?.length || 1) : null"
        [editable]="true" [resultTemplate]="rt" (keydown.enter)="onEnter()" (keydown)="onMainInputKeyDown($event)"
        placeholder="{{ !items.length ? ('QUESTIONS-CHOOSER-PLACEHOLDER' | translate) : '' }}" [disabled]="disabled"
        container="body"
        (focus)="onInputFocus($event)" (click)="click$.next($any($event).target.value)"
        #instance="ngbTypeahead" (selectItem)="onSelect($event)" />
    <span *ngIf="mode === 'search' && !items.length && !question" 
          class="shortcut-badge position-absolute" 
          [class.shortcut-pressed-anim]="pressedShortcut === 'f'"
          style="right: 8px; pointer-events: none;">F</span>
  </div>
</div>


<ng-template #rt let-r="result" let-t="term">
    <div class="suggestion-pill">
        <ngb-highlight [result]="r" [term]="t"></ngb-highlight>
    </div>
</ng-template>
