<!-- PROTOTYPE — dev-only switcher for the "now" indicator variants; removed once a variant is chosen. -->
<div class="proto-now-panel">
  <span class="proto-now-panel-title">{{ "PROTO.NOW.TITLE" | translate }}</span>
  <div class="proto-now-panel-options">
    <button
      *ngFor="let option of variants"
      type="button"
      class="proto-now-panel-btn"
      [class.active]="variant === option"
      (click)="select(option)"
    >
      {{ variantLabel(option) | translate }}
    </button>
  </div>
</div>
