<div class="d-flex flex-column flex-grow-1" style="min-height: 0;">
  <div class="modern-toolbar">
    <!-- Group Selector Dropdown -->
    <div ngbDropdown class="dropdown d-inline-block">
      <button class="btn-outline-ghost" ngbDropdownToggle>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
          <circle cx="9" cy="7" r="4"></circle>
          <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
          <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
        </svg>
        <span>{{ dataService.groupFilter || ('TP-GROUP-SELECT.ALL' | translate) }}</span>
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="6 9 12 15 18 9"></polyline>
        </svg>
      </button>
      <div ngbDropdownMenu class="modern-dropdown-menu">
        <button class="dropdown-item py-2" [class.active]="!dataService.groupFilter" (click)="dataService.groupFilter = ''; loadGraphDataAndRefresh()">
          {{ "TP-GROUP-SELECT.ALL" | translate }}
        </button>
        <div class="dropdown-divider"></div>
        <button class="dropdown-item py-2" *ngFor="let tpGroup of dataService.tpGroups" [class.active]="dataService.groupFilter === tpGroup" (click)="dataService.groupFilter = tpGroup; loadGraphDataAndRefresh()">
          {{ tpGroup }}
        </button>
      </div>
    </div>

    <!-- Date Slider -->
    <div class="modern-slider-container" style="min-width: 260px;">
      <div class="slider-header">
        <span class="slider-label">{{ 'DATE' | translate }}</span>
        <span class="slider-value">{{ date | date:'yyyy-MM-dd' }}</span>
      </div>
      <input type="range" class="modern-slider" style="width: 100%;" (input)="loadGraphDataAndRefresh()" [(ngModel)]="date" [max]="getAdjustedMaxTimestamp()" [min]="this.min" id="dateSlider" step="86400000" [disabled]="!dataService.repositories.length || loading" [style.--slider-progress.%]="(date - min) / (getAdjustedMaxTimestamp() - min) * 100">
    </div>

    <!-- Bar Index -->
    <div class="modern-slider-container" style="min-width: 160px;">
      <div class="slider-header">
        <span class="slider-label">{{ 'BAR-INDEX' | translate }}</span>
        <span class="slider-value">{{ dataService.barIndex * 10 }}</span>
      </div>
      <input type="range" class="modern-slider" style="width: 100%;" (input)="changeBarIndex()" [(ngModel)]="dataService.barIndex" min="1" max="9" id="barSlider" step="1" [style.--slider-progress.%]="(dataService.barIndex - 1) / 8 * 100">
    </div>

    <!-- Reload Button -->
    <button class="btn-outline-ghost anim-spin-hover" (click)="loadGraph(dataService.startDate, dataService.endDate)" [disabled]="!dataService.repositories.length || loading" [appTooltip]="{ text: ('OVERVIEW-GRAPH.RELOAD-TOOLTIP' | translate), shortcut: ['R'] }">
      <div *ngIf="loading" class="d-flex">
        <svg class="fa-spin" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8"></path>
          <path d="M21 3v5h-5"></path>
        </svg>
      </div>
      <div *ngIf="!loading" class="d-flex">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8"></path>
          <path d="M21 3v5h-5"></path>
        </svg>
      </div>
    </button>
  </div>

  <div class="graph-wrapper d-flex flex-column" style="flex: 1; position: relative; padding: 1rem;">
    <div class="chart-container" style="flex: 1; min-height: 400px; position: relative;">
      <canvas #myChart id="myChart" baseChart [chartType]="'bar'" [datasets]="chartData" [options]="chartOptions" [labels]="chartLabels" [legend]="true">
      </canvas>
    </div>
    <div class="d-flex justify-content-end align-items-center mt-2">
      <span class="text-muted small bg-surface rounded-pill px-3 py-1 border shadow-sm d-flex align-items-center" style="font-size: 0.85rem;">
        <i class="fas fa-clock mr-2" style="color: var(--color-primary);"></i>
        {{ date | date:'full':undefined:translateService.currentLang }}
      </span>
    </div>
  </div>
</div>

<ng-template #dateTooltip>{{ 'DATE' | translate }}</ng-template>
