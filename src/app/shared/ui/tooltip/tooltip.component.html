<div class="tooltip-container"
  [class]="placement"
  [class.show]="show"
  [class.instant]="instant"
  [attr.data-instant]="instant ? '' : null"
  [class.shortcut-pressed]="shortcutPressed"
  [class.has-template]="!isString(content)"
  [class.is-text]="isString(content)"
  [style.max-width]="resolvedMaxWidth">
  <span class="tooltip-text" [class.w-100]="!isString(content)">
    @if (isString(content)) {
      <span [innerHTML]="content"></span>
    } @else {
      <ng-container [ngTemplateOutlet]="contentAsTemplate()" [ngTemplateOutletContext]="context"></ng-container>
    }
  </span>
  @if (parsedShortcutKeys?.length) {
    <div class="shortcut-combo ml-1">
      @for (key of parsedShortcutKeys; track key; let last = $last) {
        <kbd class="shortcut-key" [class.shortcut-pressed-anim]="shortcutPressed">{{ key }}</kbd>
        @if (!last && !isMac) {
          <span class="key-sep">+</span>
        }
      }
    </div>
  }
</div>
