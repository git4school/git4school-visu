<div ngbDropdown class="dropdown tp-group-selector">
  <button
    type="button"
    #tpGroupToggle
    class="tp-group-pill"
    [class.tp-group-pill--active]="selected"
    ngbDropdownToggle
    [appTooltip]="{ text: ('TP-GROUP-SELECT.TOOLTIP' | translate), shortcut: ['G'] }"
    [attr.aria-label]="'TP-GROUP-SELECT.TOOLTIP' | translate"
  >
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
      <circle cx="9" cy="7" r="4"></circle>
      <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
      <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
    </svg>
    <span class="tp-group-label">{{ selected || ("TP-GROUP-SELECT.ALL" | translate) }}</span>
    <svg class="dropdown-chevron" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="6 9 12 15 18 9"></polyline>
    </svg>
  </button>

  <div ngbDropdownMenu class="modern-dropdown-menu tp-group-menu">
    <button type="button" class="dropdown-item" ngbDropdownItem [class.active]="!selected" (click)="select('')">
      {{ "TP-GROUP-SELECT.ALL" | translate }}
    </button>
    <div class="dropdown-divider"></div>
    <button
      type="button"
      class="dropdown-item tp-group-item"
      ngbDropdownItem
      *ngFor="let group of groups"
      [class.active]="selected === group"
      (click)="select(group)"
    >
      <span class="tp-group-name">{{ group }}</span>
      <span
        class="tp-group-count"
        *ngIf="countFor(group) > 0"
        [attr.title]="'TP-GROUP-SELECT.STUDENT-COUNT' | translate: { count: countFor(group) }"
      >
        <i class="fas fa-user"></i>{{ countFor(group) }}
      </span>
    </button>
  </div>
</div>
