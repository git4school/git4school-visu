<div class="toasts-container"
  (mouseenter)="onMouseEnter()"
  (mouseleave)="onMouseLeave()">
  @for (toast of toasts; track trackById(i, toast); let i = $index; let last = $last) {
    <div
      class="toast-wrapper"
      [class.expanded]="isHovered"
      [class.hidden-stacked]="(toasts.length - 1 - i) >= 3"
      [style.z-index]="i"
      [style.--index]="toasts.length - 1 - i"
      [style.--offset]="getOffset(i) + 'px'">
      <div class="toast-pill"
        [@toastEntry]
        [ngClass]="'toast-' + toast.type"
        (click)="remove(toast.id)"
        (mouseenter)="pauseTimer(toast)"
        (mouseleave)="resumeTimer(toast)"
        #toastElement>
        <div class="toast-header">
          @if (toast.type === 'success') {
            <i class="fas fa-check-circle"></i>
          }
          @if (toast.type === 'warning') {
            <i class="fas fa-exclamation-triangle"></i>
          }
          @if (toast.type === 'error') {
            <i class="fas fa-exclamation-circle"></i>
          }
          @if (toast.type === 'copy') {
            <i class="far fa-copy"></i>
          }
          <span class="toast-title" [innerHTML]="toast.title"></span>
        </div>
        @if (toast.message) {
          <div class="toast-message-container">
            <div class="toast-message" [innerHTML]="toast.message"></div>
          </div>
        }
      </div>
    </div>
  }
</div>
