<div class="modal-backdrop" *ngIf="isOpen" (click)="onClose()">
  <div class="modal-dialog" [ngClass]="'modal-' + size" (click)="onModalClick($event)">
    <div class="modal-content card">
      <div class="modal-header card-header" *ngIf="title">
        <h5 class="modal-title">{{ title }}</h5>
        <button type="button" class="btn btn-sm btn-outline-secondary close-btn" aria-label="Close" (click)="onClose()">
          <span aria-hidden="true">&times;</span>
        </button>
      </div>
      <div class="modal-body card-body">
        <ng-content></ng-content>
      </div>
    </div>
  </div>
</div>
